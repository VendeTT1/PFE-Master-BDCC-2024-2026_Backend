events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format custom_log '"Request: $request\n Status: $status\n Request_URI: $request_uri\n Host: $host\n Client_IP: $remote_addr\n Proxy_IP(s): $proxy_add_x_forwarded_for\n Proxy_Hostname: $proxy_host\n Real_IP: $http_x_real_ip\n User_Client: $http_user_agent \n';

    sendfile on;
    keepalive_timeout 65;

    proxy_headers_hash_max_size 512;
    proxy_headers_hash_bucket_size 64;

    include /etc/nginx/conf.d/*.conf;
}
